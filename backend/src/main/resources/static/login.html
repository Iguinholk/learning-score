
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Learning Score</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/img/favicon.ico" sizes="any">
</head>

<body class="pagina-login">

<div class="login-container">

  <div class="login-card">

    <section class="login-apresentacao">
      <h1 class="sr-only">Learning Score</h1>

      <img
              src="/img/logo-completo-escuro.png"
              alt="Learning Score"
              class="login-logo"
      >

      <p>
        Atividades, prazos, notas e
        mensalidades da sua vida acadêmica
        em um só lugar.
      </p>
    </section>

    <main class="login-formulario">

      <h2>Entrar na sua conta</h2>

      <div id="erro" class="aviso erro"
           role="alert" hidden></div>

      <form id="form" novalidate>

        <label for="email">E-mail</label>

        <div class="login-campo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18"
                  height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>

          <input
                  id="email"
                  type="email"
                  placeholder="voce@exemplo.com"
                  autocomplete="username"
                  required
          >
        </div>

        <label for="senha">Senha</label>

        <div class="login-campo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="10" width="16"
                  height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>

          <input
                  id="senha"
                  type="password"
                  placeholder="Sua senha"
                  autocomplete="current-password"
                  required
          >

          <button
                  type="button"
                  id="mostrar-senha"
                  class="login-olho"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button
                type="submit"
                id="enviar"
                class="login-entrar"
        >
          Entrar
        </button>
      </form>

      <div class="login-cadastro">
        <strong>Novo por aqui?</strong>

        <a href="/cadastro.html">
          Criar conta
        </a>
      </div>

    </main>
  </div>

  <footer class="login-rodape">
    Ao acessar o Learning Score, você concorda
    com nossos Termos de Uso e Política de Privacidade.
  </footer>

</div>

<script src="/js/core.js"></script>

<script>
  'use strict';

  api.get('/api/auth/me')
          .then(() => {
            location.href = '/app.html#/dashboard';
          })
          .catch(() => {});

  const senhaInput = document.getElementById('senha');
  const mostrarSenha = document.getElementById('mostrar-senha');

  mostrarSenha.addEventListener('click', () => {
    const visivel = senhaInput.type === 'password';

    senhaInput.type = visivel ? 'text' : 'password';

    mostrarSenha.setAttribute('aria-pressed', String(visivel));
    mostrarSenha.setAttribute(
            'aria-label',
            visivel ? 'Ocultar senha' : 'Mostrar senha'
    );
  });

  document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();

    const erro = document.getElementById('erro');
    const btn = document.getElementById('enviar');

    erro.hidden = true;

    const email = document.getElementById('email').value.trim();
    const senha = senhaInput.value;

    if (!email || !senha) {
      erro.textContent = 'Preencha o e-mail e a senha.';
      erro.hidden = false;
      return;
    }

    btn.disabled = true;

    try {
      await api.post('/api/auth/login', { email, senha });
      location.href = '/app.html#/dashboard';
    } catch (e) {
      erro.textContent = e.message;
      erro.hidden = false;
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
