
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Learning Score</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="stylesheet" href="/css/temas.css">
  <script src="/js/temas.js"></script>


  <link
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap"
          rel="stylesheet"
  >

  <!-- Estilo principal -->
  <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>

<!-- Link de acessibilidade -->
<a class="pular" href="#conteudo">
  Ir para o conteúdo
</a>

<!-- Cabeçalho para dispositivos móveis -->
<div class="topo-mobile">
  <strong>Learning Score</strong>

  <button
          class="btn sec peq"
          id="btn-menu"
          aria-controls="lateral"
          aria-expanded="false"
  >
    Menu
  </button>
</div>

<!-- Estrutura principal -->
<div class="app">

  <!-- Menu lateral -->
  <aside
          class="lateral"
          id="lateral"
          aria-label="Menu lateral"
  ></aside>

  <!-- Conteúdo das páginas -->
  <main
          id="conteudo"
          tabindex="-1"
          aria-live="polite"
  ></main>

</div>

<!-- Mini-player de vídeo -->
<aside
        class="player"
        id="player"
        hidden
        aria-label="Mini-player de vídeo"
>
  <header>
    <strong id="player-titulo">Vídeo</strong>

    <button
            id="player-min"
            aria-label="Minimizar player"
            aria-pressed="false"
    >
      &ndash;
    </button>

    <button
            id="player-fechar"
            aria-label="Fechar player"
    >
      &times;
    </button>
  </header>

  <div class="video" id="player-video"></div>
</aside>

<!-- Notificações temporárias -->
<div
        id="toasts"
        role="status"
        aria-live="polite"
></div>

<!-- Biblioteca de gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<!-- Arquivos JavaScript do sistema -->
<script src="/js/core.js"></script>
<script src="/js/paginas.js"></script>
<script src="/js/principal.js"></script>

</body>

</html>
