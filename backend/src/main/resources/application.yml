spring:
  application:
    name: learning-score
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learningscore}
    username: ${DB_USER:learningscore}
    password: ${DB_PASSWORD}          # obrigatória: defina a variável de ambiente (nunca grave senhas no código)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # o esquema é criado SOMENTE pelo Flyway
    properties:
      hibernate.jdbc.time_zone: America/Bahia
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bahia
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # em produção (HTTPS) use COOKIE_SECURE=true
  error:
    include-message: never
    include-stacktrace: never

learningscore:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  demo:
    enabled: ${DEMO_ENABLED:true}       # cria dados de demonstração (usuário demo@learningscore.local)
    senha: ${DEMO_PASSWORD:Demo@12345}
  exclusao:
    atraso-minutos: 60                  # janela para cancelar; deve ser bem menor que 24h (RF12)
  mail:
    from: ${MAIL_FROM:nao-responder@learningscore.local}
