# PostgreSQL local para desenvolvimento:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: learningscore
      POSTGRES_USER: learningscore
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
